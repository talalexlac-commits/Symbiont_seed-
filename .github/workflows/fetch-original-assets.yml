name: Fetch original site assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-original-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download byte-identical source images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfRMqnscrmZgmcFSYYZ45pTjmONRu5a2Gpt9Nz3LqJDMcZV9AOELgWic_7TP88CkcWJw3CazrZCMjlXVj2-6q1K47PfBuL9uNu4RGfQyoA24h8V-b4jHw1UUeAQs0Ih0MYp7FMRAFydHNm4XgX3gGcuWiH2DNyXV5WUgGs_9CId-mIV=s2048?key=e5PST706jQC49FalAJExxg' -o assets/persona-selection-original.jpg
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUc2quAVtHAm3mNHXOa4Z4GztwSJaAkpK4n7sxiNWTCjWkKZtKwWWK08yQdLa-fcDjSLzLXboQAsRtUZPXb48tgrSWdn5gltBL4n4B7AYgesTOYl93oFk3L2xYzhLj7SiOrIuRTGeTWp8oQ8anjZaGD9W8aDI42F5q1q4yPjifj4U8X3rYU=s2048?key=e5PST706jQC49FalAJExxg' -o assets/runtime-action-original.jpg
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUcRe6vp2KzJRlKOEub2pTE6CVgnHIo2MXUxQnRR1bmnKokvra2SR-L9H9CYkjA6wgBkBf4Gxej3c9z-Ub33_QfA4YLbFynhPJwzAABLlcq1DLlNUjrnFEP0MPGmZEjswwWpbnYrWEoKUpW4qoMNXJZUdp0e7KR1HItKgP5MnNb15cvIefw=s2048?key=e5PST706jQC49FalAJExxg' -o assets/documents-proof-original.jpg
          curl -L --fail --retry 3 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUcZT_VHLBQo1B6jZCAzH4DbrIEKa7_TuFZb7HNYFeJGYiOUD3keUlJW6uQ-9-IxYQCV4SIamhTDacp7hAYEVFTg6hPM3XN3WPI1z9OaYoA7C19cU3AaIPisgKLpjwv9Tnyx4fY9Xuk2F-XPfTHTwTg1uj0GKWySwmya7EW4kkBgJ8iN=s2048?key=e5PST706jQC49FalAJExxg' -o assets/demo-pulse-original.jpg

      - name: Verify exact hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/assets.sha256 <<'EOF'
          b02da6e3ff80d4c82beabaddbbfe96da5a2cc3a4d0dfff0dda1ff806a3df5533  assets/persona-selection-original.jpg
          5e43abf81fca5a3b455a796d19501cd9cf3ebb091f806b40b1cbcb510e99542c  assets/runtime-action-original.jpg
          46b606b0a43549d8e49738c8574e18ad1c10975374d319d9587fc55072a68f0a  assets/documents-proof-original.jpg
          6b476694cbb9f7f3adc09bb4d0916af064706e3a0e2c1e146bd02c6d6ce20982  assets/demo-pulse-original.jpg
          EOF
          sha256sum -c /tmp/assets.sha256

      - name: Commit verified original images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'talalexlac-commits'
          git config user.email 'tal.alex.lac@gmail.com'
          git add assets
          if git diff --cached --quiet; then
            echo 'Assets already present.'
            exit 0
          fi
          git commit -m 'Add verified original product images'
          git push
